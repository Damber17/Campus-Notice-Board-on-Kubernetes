# Purpose: Run blue baseline and green candidate in parallel for blue/green releases.
# Apply command: kubectl apply -f manifests/bluegreen/deployments.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board-blue
  namespace: nb-02230123
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notice-board
      slot: blue
  template:
    metadata:
      labels:
        app: notice-board
        slot: blue
        version: "1.0.0"
    spec:
      containers:
        - name: api
          image: notice-board:02230123-1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 250m, memory: 192Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board-green
  namespace: nb-02230123
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notice-board
      slot: green
  template:
    metadata:
      labels:
        app: notice-board
        slot: green
        version: "1.1.0"
      annotations:
        # Change this value to force a declarative Pod-template rollout after flag changes.
        cte412/flag-restart: "false"
    spec:
      containers:
        - name: api
          image: notice-board:02230123-1.1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FEATURE_PINNED
              valueFrom:
                configMapKeyRef:
                  name: notice-board-flags
                  key: FEATURE_PINNED
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 250m, memory: 192Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
