# Purpose: Route production to blue initially and preview to green.
# Apply command: kubectl apply -f manifests/bluegreen/services.yaml
apiVersion: v1
kind: Service
metadata:
  name: notice-board
  namespace: nb-02230123
spec:
  type: ClusterIP
  selector:
    app: notice-board
    slot: green
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board-ext
  namespace: nb-02230123
spec:
  type: NodePort
  selector:
    app: notice-board
    slot: green
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board-preview
  namespace: nb-02230123
spec:
  type: ClusterIP
  selector:
    app: notice-board
    slot: green
  ports:
    - name: http
      port: 80
      targetPort: http
