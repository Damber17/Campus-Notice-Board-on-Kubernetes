# Purpose: Task 5 variant that releases 1.1.0 with Recreate and records the change cause.
# Apply command: kubectl apply -f manifests/rolling/notice-board-recreate-1.1.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board
  namespace: nb-02230123
  annotations:
    kubernetes.io/change-cause: "Task 5 Recreate release to 1.1.0 by Damber Khatiwara"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    # Recreate deliberately terminates old Pods before creating new Pods for downtime measurement.
    type: Recreate
  selector:
    matchLabels:
      app: notice-board
  template:
    metadata:
      labels:
        app: notice-board
        version: "1.1.0"
    spec:
      containers:
        - name: api
          image: notice-board:02230123-1.1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 250m, memory: 192Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 5
          livenessProbe:
            # TCP checks process responsiveness without failing during intentional health warm-up.
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
