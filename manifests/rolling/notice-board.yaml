# Purpose: Deploy baseline version and expose it inside the cluster and on localhost:30090.
# Apply command: kubectl apply -f manifests/rolling/notice-board.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board
  namespace: nb-02230123
  annotations:
    kubernetes.io/change-cause: "Initial baseline 1.0.0 for student 02230123"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    # RollingUpdate keeps available Pods during normal releases.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app: notice-board
  template:
    metadata:
      labels:
        app: notice-board
        version: "1.0.0"
    spec:
      containers:
        - name: api
          image: notice-board:02230123-1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # Delay permits the required 5-second warm-up period.
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 5
          livenessProbe:
            # TCP avoids restarting a container during the intentional unhealthy warm-up.
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board
  namespace: nb-02230123
spec:
  type: ClusterIP
  selector:
    app: notice-board
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board-ext
  namespace: nb-02230123
spec:
  type: NodePort
  selector:
    app: notice-board
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30090
