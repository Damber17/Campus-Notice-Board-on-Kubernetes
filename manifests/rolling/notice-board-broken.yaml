# Purpose: Task 6 failed release; readiness remains false, while maxUnavailable=0 preserves old capacity.
# Apply command: kubectl apply -f manifests/rolling/notice-board-broken.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board
  namespace: nb-02230123
  annotations:
    kubernetes.io/change-cause: "Task 6 intentionally broken health endpoint release"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    # Preserve all currently available replicas while the new broken Pods fail readiness.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app: notice-board
  template:
    metadata:
      labels:
        app: notice-board
        version: "1.2.0-broken"
    spec:
      containers:
        - name: api
          image: notice-board:02230123-1.2.0-broken
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 250m, memory: 192Mi }
          readinessProbe:
            # This probe never succeeds in the broken image, preventing traffic to it.
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 5
          livenessProbe:
            # TCP avoids restarting the process; the failed readiness probe is the intended fault.
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
